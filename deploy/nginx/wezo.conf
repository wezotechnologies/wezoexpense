# Wezo Expense Tracker — nginx reverse proxy.
#
# The upstream itself lives in /etc/nginx/conf.d/wezo-upstream.conf, which
# deploy/deploy.sh rewrites to point at whichever colour is live. Keeping it in
# a separate file means a deploy never edits this one.
#
# After pointing DNS here, run:
#   sudo certbot --nginx -d expense.wezo.co
# certbot rewrites this file to add the TLS server block and the HTTP redirect.

server {
    listen 80;
    listen [::]:80;

    # The subdomain this app is served on. certbot matches on this, so it must
    # be correct before you request a certificate.
    server_name expense.wezo.co;

    # Receipt uploads are capped at 10 MB in the app; allow a little headroom
    # so the app returns its own friendly 413 rather than nginx's bare one.
    client_max_body_size 12M;

    # A slow phone on 3G uploading a photo shouldn't be cut off.
    client_body_timeout 120s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # The app sets its own security headers (next.config.ts). These cover the
    # bits nginx is better placed to assert.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compress text; images and PDFs are already compressed.
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    # Immutable build output — hashed filenames, safe to cache hard.
    location /_next/static/ {
        proxy_pass http://wezo_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The service worker must never be cached, or clients pin an old one.
    location = /sw.js {
        proxy_pass http://wezo_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Health probe: available, but not from the public internet.
    location = /api/health {
        allow 127.0.0.1;
        allow ::1;
        # Azure load-balancer probe range, if you put one in front.
        allow 168.63.129.16;
        deny all;
        proxy_pass http://wezo_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    location / {
        proxy_pass http://wezo_app;
        proxy_http_version 1.1;

        # Keepalive to the upstream: needs an empty Connection header.
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Auth.js builds callback URLs from these, so they must be accurate or
        # sign-in redirects break behind TLS.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # If the live colour dies mid-deploy, try the request once more rather
        # than handing the user a 502.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}
